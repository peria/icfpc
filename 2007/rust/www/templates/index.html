<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/bulma/css/bulma.min.css">
    <script src="/static/index.js"></script>
</head>

<body onload="setup()">
    <header class="hero">
        <div class="hero-body" style="background: #def;">
            <h1 class="title">ICFPC 2007: Fuun Prefix and results</h1>
        </div>
    </header>

    <section class="section">
        <div class="container">
            Prefix: <input type="text" name="prefix" id="prefix" class="input is-medium">
            <div class="level">
                <div class="level-left">
                    Catalog: <input type="number" name="page" id="catalog" class="input is-medium"> page
                </div>
            </div>
            <button type="button" class="button" onclick="submit()">Submit</button>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <table class="table is-striped is-fullwidth">
                <thead>
                    <th>Time</th>
                    <th>Picture</th>
                    <th>Prefix</th>
                    <th>RNA数</th>
                    <th>Diff数</th>
                    <th>Risk</th>
                    <th>計算時間</th>
                </thead>
                <tbody id="table"></tbody>
            </table>
        </div>
    </section>
</body>

</html>
